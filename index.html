<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สุ่ม Seed Minecraft</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Minecraft', system-ui, monospace;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a2a1f;
            background-image: 
                linear-gradient(45deg, #2d4a2d 25%, transparent 25%),
                linear-gradient(-45deg, #2d4a2d 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #2d4a2d 75%),
                linear-gradient(-45deg, transparent 75%, #2d4a2d 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }

        .game-container {
            background: #3b2e1e;
            background: linear-gradient(145deg, #5a4a32, #2e2418);
            border: 6px solid #7a5c3a;
            border-radius: 20px;
            box-shadow: 
                0 12px 0 #1e150e,
                0 20px 30px rgba(0,0,0,0.7),
                inset 0 2px 4px rgba(255,215,140,0.3);
            max-width: 620px;
            width: 100%;
            padding: 24px 20px 30px;
            transition: transform 0.1s;
        }

        h1 {
            text-align: center;
            color: #f7e7b4;
            text-shadow: 4px 4px 0 #3d2b16, 0 0 10px #b8860b;
            font-size: 2.3rem;
            letter-spacing: 3px;
            margin-top: -8px;
            margin-bottom: 16px;
            font-weight: 700;
            word-break: break-word;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        h1 span {
            font-size: 2rem;
            filter: drop-shadow(2px 4px 4px black);
        }

        .seed-display-box {
            background: #1e1710;
            border: 4px solid #6b4f2e;
            border-radius: 16px;
            padding: 18px 10px;
            margin-bottom: 18px;
            box-shadow: inset 0 6px 8px #0e0b08, 0 6px 0 #2b1f14;
            transition: 0.2s;
        }

        .seed-label {
            color: #b8a67c;
            text-align: center;
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 600;
            text-shadow: 2px 2px 0 #0a0705;
        }

        .seed-value {
            background: #0b120b;
            border: 3px solid #4e6b3c;
            border-radius: 12px;
            padding: 14px 8px;
            font-size: 2.2rem;
            font-weight: bold;
            color: #b9ffa0;
            text-align: center;
            font-family: 'Courier New', 'Minecraft', monospace;
            letter-spacing: 2px;
            text-shadow: 0 0 12px #85ff5e, 0 0 4px #0f0;
            word-break: break-all;
            box-shadow: inset 0 0 16px #1f2e1a, 0 4px 0 #2d401f;
            transition: 0.15s;
            min-height: 5.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .seed-value.small-seed {
            font-size: 1.6rem;
        }

        .seed-value.tiny-seed {
            font-size: 1.2rem;
        }

        .button-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            margin: 24px 0 18px;
        }

        .mc-btn {
            background: #7b6b4f;
            background: linear-gradient(180deg, #a28e6b 0%, #6e5a3e 100%);
            border: none;
            border-bottom: 6px solid #3a2e1e;
            border-radius: 14px;
            padding: 14px 26px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #fef9e3;
            text-shadow: 3px 3px 0 #2e1f0e;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1e150e, 0 8px 12px rgba(0,0,0,0.5);
            transition: all 0.07s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1 0 auto;
            min-width: 160px;
            user-select: none;
            font-family: inherit;
        }

        .mc-btn:active {
            transform: translateY(6px);
            border-bottom-width: 2px;
            box-shadow: 0 2px 0 #1e150e, 0 5px 10px black;
        }

        .mc-btn:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            border-bottom-width: 2px;
            box-shadow: 0 2px 0 #1e150e;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        .mc-btn.seed-btn {
            background: linear-gradient(180deg, #5f8b4b, #2d5e1e);
            border-bottom-color: #1b3a0e;
            text-shadow: 3px 3px 0 #17300a;
        }

        .mc-btn.seed-btn:active {
            border-bottom-color: #1b3a0e;
        }

        .mc-btn.copy-btn {
            background: linear-gradient(180deg, #5478a8, #244b77);
            border-bottom-color: #0f263b;
            text-shadow: 3px 3px 0 #0a1a29;
            flex: 0.7;
            min-width: 120px;
        }

        .history-panel {
            background: #2b241b;
            border: 3px solid #5e4e36;
            border-radius: 14px;
            padding: 16px 14px;
            margin-top: 16px;
            box-shadow: inset 0 0 12px #0d0a07, 0 4px 0 #1a130d;
        }

        .history-title {
            color: #c9b382;
            font-size: 1.2rem;
            text-shadow: 2px 2px 0 #1a130a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 110px;
            overflow-y: auto;
            padding-right: 6px;
            scrollbar-width: thin;
            scrollbar-color: #6b5a3e #1e1810;
        }

        .history-list::-webkit-scrollbar {
            width: 8px;
        }

        .history-list::-webkit-scrollbar-track {
            background: #1e1810;
            border-radius: 8px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: #6b5a3e;
            border-radius: 8px;
        }

        .history-item {
            background: #1e2e1a;
            border: 2px solid #587a42;
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 1rem;
            font-weight: bold;
            color: #b6f5a2;
            text-shadow: 1px 1px 0 #101b0c;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            box-shadow: inset 0 1px 4px #2e4a1e, 0 2px 0 #1e2e10;
            word-break: break-all;
            max-width: 100%;
            transition: 0.1s;
            cursor: default;
        }

        .empty-history {
            color: #8f7e62;
            font-style: italic;
            font-size: 0.95rem;
            text-shadow: 1px 1px 0 #1a130a;
            padding: 6px 0;
        }

        .info-text {
            color: #b9a57b;
            text-align: center;
            font-size: 0.9rem;
            margin-top: 12px;
            text-shadow: 1px 1px 0 #1a130a;
            letter-spacing: 1px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>
            <span>⛏️</span> SEED RANDOM <span>🌱</span>
        </h1>

        <div class="seed-display-box">
            <div class="seed-label">🌍 WORLD SEED</div>
            <div id="seedDisplay" class="seed-value">0</div>
        </div>

        <div class="button-panel">
            <button id="randomBtn" class="mc-btn seed-btn">
                🎲 สุ่ม Seed
            </button>
            <button id="copyBtn" class="mc-btn copy-btn">
                📋 คัดลอก
            </button>
        </div>

        <div class="history-panel">
            <div class="history-title">
                <span>📜</span> ประวัติ Seed (ล่าสุด 10)
            </div>
            <div id="historyList" class="history-list">
                <!-- รายการจะถูกสร้างโดย JavaScript -->
                <div class="empty-history">— ยังไม่มีประวัติ —</div>
            </div>
        </div>
        <div class="info-text">
            กดปุ่ม "สุ่ม Seed" เพื่อสุ่มค่าเหมือนใน Minecraft
        </div>
    </div>

    <script>
        (function() {
            // ========== องค์ประกอบ DOM ==========
            const seedDisplay = document.getElementById('seedDisplay');
            const randomBtn = document.getElementById('randomBtn');
            const copyBtn = document.getElementById('copyBtn');
            const historyList = document.getElementById('historyList');

            // ========== ตัวแปรสถานะ ==========
            let currentSeed = null;          // เก็บ seed ปัจจุบัน (แบบ number หรือ string)
            let historySeeds = [];           // เก็บประวัติ seed (เรียงจากใหม่ไปเก่า)

            // ========== ฟังก์ชันช่วยเหลือ ==========

            // สุ่ม seed แบบ Minecraft: รองรับทั้ง Java (64-bit signed) และ Bedrock (unsigned 32-bit)
            // แต่เพื่อให้ดูหลากหลายและเหมือนเวอร์ชัน Java มากที่สุด (มีค่าติดลบ) 
            // เราจะสุ่มแบบ 64-bit signed integer (ช่วง -2^63 ถึง 2^63 - 1)
            // แต่ในทางปฏิบัติ เราจะใช้ BigInt ในการจัดการเพื่อให้ได้ค่าที่ถูกต้อง
            // และแปลงเป็น string โดยไม่ต้องปัดเศษ
            function generateMinecraftSeed() {
                // สุ่ม 8 bytes (64 บิต) โดยใช้ Crypto.getRandomValues ถ้ามี
                const buffer = new Uint8Array(8);
                if (window.crypto && window.crypto.getRandomValues) {
                    window.crypto.getRandomValues(buffer);
                } else {
                    // fallback: Math.random() แบบบ้านๆ
                    for (let i = 0; i < 8; i++) {
                        buffer[i] = Math.floor(Math.random() * 256);
                    }
                }

                // แปลงเป็น BigInt แบบ 64-bit signed (two's complement)
                let value = 0n;
                for (let i = 7; i >= 0; i--) {  // ทำจากไบต์สูงไปต่ำ
                    value = (value << 8n) | BigInt(buffer[i]);
                }

                // ตอนนี้ value อยู่ในช่วง 0 ถึง 2^64 - 1
                // แปลงเป็น signed 64-bit: ถ้ามากกว่า 2^63 - 1 ให้ลบ 2^64
                const MAX_SIGNED = (1n << 63n) - 1n; // 9223372036854775807
                const TWO_POW_64 = 1n << 64n;        // 18446744073709551616

                if (value > MAX_SIGNED) {
                    value = value - TWO_POW_64;
                }

                return value; // คืนค่าเป็น BigInt
            }

            // แสดง seed บนหน้าจอ พร้อมปรับขนาดตัวอักษรถ้าจำนวนหลักยาว
            function displaySeed(seedBigInt) {
                if (seedBigInt === null || seedBigInt === undefined) {
                    seedDisplay.textContent = '—';
                    return;
                }
                const seedStr = seedBigInt.toString();
                seedDisplay.textContent = seedStr;

                // ปรับขนาดฟอนต์ตามความยาว
                seedDisplay.classList.remove('small-seed', 'tiny-seed');
                if (seedStr.length > 15) {
                    seedDisplay.classList.add('tiny-seed');
                } else if (seedStr.length > 10) {
                    seedDisplay.classList.add('small-seed');
                }
            }

            // เพิ่ม seed ลงประวัติ (เก็บเป็น string) และอัปเดต UI
            function addToHistory(seedBigInt) {
                if (seedBigInt === null || seedBigInt === undefined) return;
                const seedStr = seedBigInt.toString();

                // หลีกเลี่ยงการซ้ำติดกัน (ถ้าซ้ำกับอันล่าสุดให้ข้าม)
                if (historySeeds.length > 0 && historySeeds[0] === seedStr) {
                    // แต่ถ้าซ้ำก็ไม่ต้องเพิ่ม และไม่ต้องอัปเดต history UI? 
                    // แต่เราอาจจะไม่อยากให้ซ้ำเลย แต่ถ้าซ้ำเราก็ไม่เพิ่ม
                    return;
                }

                // เพิ่มไปด้านหน้า (ใหม่สุด)
                historySeeds.unshift(seedStr);
                // จำกัด 10 รายการ
                if (historySeeds.length > 10) {
                    historySeeds.pop();
                }

                renderHistory();
            }

            // แสดงผลประวัติ
            function renderHistory() {
                if (historySeeds.length === 0) {
                    historyList.innerHTML = '<div class="empty-history">— ยังไม่มีประวัติ —</div>';
                    return;
                }

                // สร้างรายการ
                let html = '';
                for (let i = 0; i < historySeeds.length; i++) {
                    const seedStr = historySeeds[i];
                    // ตัดให้สั้นถ้ายาวเกิน 22 ตัวอักษร
                    let displayStr = seedStr;
                    if (displayStr.length > 22) {
                        displayStr = displayStr.slice(0, 10) + '…' + displayStr.slice(-8);
                    }
                    html += `<div class="history-item" title="${seedStr}">${displayStr}</div>`;
                }
                historyList.innerHTML = html;
            }

            // ฟังก์ชันสุ่มและอัปเดตทั้งหมด
            function randomizeSeed() {
                // สร้าง seed ใหม่
                const newSeed = generateMinecraftSeed();
                currentSeed = newSeed;

                // แสดงผล
                displaySeed(newSeed);

                // เพิ่มประวัติ
                addToHistory(newSeed);

                // เพิ่มแอนิเมชันเล็กน้อย
                seedDisplay.style.transform = 'scale(1.02)';
                setTimeout(() => {
                    seedDisplay.style.transform = 'scale(1)';
                }, 100);
            }

            // คัดลอก seed ไปยังคลิปบอร์ด
            async function copySeedToClipboard() {
                if (currentSeed === null || currentSeed === undefined) {
                    // ถ้ายังไม่มี seed ให้สุ่มก่อน
                    randomizeSeed();
                }

                const seedStr = currentSeed.toString();
                try {
                    await navigator.clipboard.writeText(seedStr);
                    // แสดงการตอบสนอง
                    const originalText = copyBtn.innerHTML;
                    copyBtn.innerHTML = '✅ คัดลอกแล้ว!';
                    copyBtn.disabled = true;
                    setTimeout(() => {
                        copyBtn.innerHTML = originalText;
                        copyBtn.disabled = false;
                    }, 1000);
                } catch (err) {
                    // fallback กรณี clipboard API ไม่ทำงาน
                    try {
                        const textArea = document.createElement('textarea');
                        textArea.value = seedStr;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                        copyBtn.innerHTML = '✅ คัดลอกแล้ว!';
                        copyBtn.disabled = true;
                        setTimeout(() => {
                            copyBtn.innerHTML = '📋 คัดลอก';
                            copyBtn.disabled = false;
                        }, 1000);
                    } catch (e) {
                        alert('ไม่สามารถคัดลอกได้: ' + e);
                    }
                }
            }

            // ========== เริ่มต้นการทำงาน ==========
            function init() {
                // สุ่ม seed เริ่มต้น
                randomizeSeed();

                // ผูกเหตุการณ์
                randomBtn.addEventListener('click', randomizeSeed);
                copyBtn.addEventListener('click', copySeedToClipboard);

                // ปุ่มลัด: กด spacebar เพื่อสุ่ม (ถ้าโฟกัสไม่ได้อยู่ในปุ่มอื่น)
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' && !e.repeat) {
                        // ป้องกันการเลื่อนหน้า
                        e.preventDefault();
                        // ถ้าโฟกัสที่ปุ่ม copy หรือ random อยู่แล้ว ไม่ต้องทำอะไร? แต่เราปล่อยให้ปุ่มเองทำงานได้
                        // แต่ถ้าโฟกัสที่ปุ่มอยู่ การกด space จะไปทริกเกอร์ปุ่มเอง เราจึงเช็คว่าถ้า activeElement เป็นปุ่ม copy หรือ random ให้ข้าม
                        const active = document.activeElement;
                        if (active === randomBtn || active === copyBtn) {
                            return; // ปล่อยให้ปุ่มจัดการเอง
                        }
                        randomizeSeed();
                    }
                });

                // เพิ่มการรีเฟรช UI ประวัติ (เผื่อมีปัญหา)
                renderHistory();
            }

            // เริ่มทำงานเมื่อโหลดเสร็จ
            init();
        })();
    </script>
</body>
              </html>
